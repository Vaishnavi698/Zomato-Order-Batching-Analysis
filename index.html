<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Order-Batching Simulation Dashboard</title>
    <!-- Include Tailwind CSS or custom styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Header Section (Fixed truncation using flex-wrap and responsive padding) -->
    <header class="w-full bg-slate-900 border-b border-slate-800 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">
                Hyper-Local Order-Batching Simulation
            </h1>
            <span class="text-xs uppercase tracking-wider bg-rose-500/10 text-rose-400 px-3 py-1 rounded-full border border-rose-500/20 font-medium">
                Live Simulation Engine
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Controls Panel (Batching Safety Rules Sliders) -->
        <aside class="lg:col-span-1 bg-slate-900/80 border border-slate-800 p-5 rounded-xl shadow-lg backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-4 border-b border-slate-800 pb-3">
                <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                <h2 class="font-semibold text-lg text-white">Batching Safety Rules</h2>
            </div>

            <div class="space-y-5">
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">Max Prep Ready Gap</span>
                        <span id="readyGapVal" class="text-rose-400 font-semibold">30 mins</span>
                    </div>
                    <input type="range" id="readyGap" min="5" max="45" value="30" class="w-full accent-rose-500 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">Max Person B ETA Delay</span>
                        <span id="maxEtaVal" class="text-rose-400 font-semibold">5 mins</span>
                    </div>
                    <input type="range" id="maxEta" min="2" max="15" value="5" class="w-full accent-rose-500 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-slate-300">Max Inter-Drop Radius</span>
                        <span id="maxDistVal" class="text-rose-400 font-semibold">3.1 km</span>
                    </div>
                    <input type="range" id="maxDist" min="0.5" max="5.0" step="0.1" value="3.1" class="w-full accent-rose-500 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <div class="pt-3 border-t border-slate-800 space-y-3">
                    <label class="flex items-center gap-3 text-sm text-slate-300 cursor-pointer">
                        <input type="checkbox" id="exclPriority" checked class="w-4 h-4 rounded accent-rose-500 bg-slate-800 border-slate-700">
                        Exclude Priority Orders (Paid Fee)
                    </label>
                    <label class="flex items-center gap-3 text-sm text-slate-300 cursor-pointer">
                        <input type="checkbox" id="exclBulky" checked class="w-4 h-4 rounded accent-rose-500 bg-slate-800 border-slate-700">
                        Exclude Bulky / Fragile Items
                    </label>
                </div>
            </div>
        </aside>

        <!-- Visualization Area -->
        <section class="lg:col-span-3 space-y-6">
            <!-- KPI Cards Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow">
                    <p class="text-xs text-slate-400 uppercase tracking-wider">Batched Orders</p>
                    <h3 id="kpiBatched" class="text-2xl font-bold text-emerald-400 mt-1">482</h3>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow">
                    <p class="text-xs text-slate-400 uppercase tracking-wider">Zomato Cost Savings</p>
                    <h3 id="kpiSavings" class="text-2xl font-bold text-white mt-1">₹12,050</h3>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow">
                    <p class="text-xs text-slate-400 uppercase tracking-wider">Rejection Rate</p>
                    <h3 id="kpiRejection" class="text-2xl font-bold text-rose-400 mt-1">18.4%</h3>
                </div>
            </div>

            <!-- Charts Container -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow h-80" id="geoChart"></div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow h-80" id="rejectionChart"></div>
            </div>
        </section>
    </main>

    <script>
        // Placeholder simulation runner to connect UI elements dynamically
        function updateSimulation() {
            const readyGap = document.getElementById('readyGap').value;
            const maxEta = document.getElementById('maxEta').value;
            const maxDist = document.getElementById('maxDist').value;

            document.getElementById('readyGapVal').innerText = readyGap + ' mins';
            document.getElementById('maxEtaVal').innerText = maxEta + ' mins';
            document.getElementById('maxDistVal').innerText = maxDist + ' km';
        }

        ['readyGap', 'maxEta', 'maxDist', 'exclPriority', 'exclBulky'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateSimulation);
        });
    </script>

    <style>
    /* Mobile Override Fix: Forces squished grids and cards to stack cleanly on small screens */
    @media (max-width: 768px) {
        body, main {
            width: 100% !important;
            overflow-x: hidden !important;
            padding: 10px !important;
        }
        /* Convert all multi-column grids into single vertical columns */
        .grid, [class*="grid-cols-"] {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            gap: 1rem !important;
        }
        /* Ensure cards, sidebars, and charts don't overflow or squish */
        aside, section, div {
            width: 100% !important;
            max-width: 100% !important;
        }
        /* Fix Plotly charts height/width on mobile */
        .js-plotly-plot, .plot-container {
            width: 100% !important;
        }
    }
</style>
</body>
</html>
